site_name: Mod Documentation
site_description: Documentation for the FCRO mod - Frontlines Combat Realism Overhaul

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - FCRO Complete Reference: FCRO_Complete_Reference.md

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code